<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的课表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/schedule.css}" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <!-- 侧边栏 -->
    <nav id="sidebar">
        <div class="sidebar-header">
            <h3>排课系统</h3>
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                <span th:text="${user.username}">学生</span>
            </div>
        </div>

        <ul class="list-unstyled components">
            <li>
                <a href="/student/dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span>首页</span>
                </a>
            </li>
            <li>
                <a href="/student/courses">
                    <i class="bi bi-book"></i>
                    <span>我的课程</span>
                </a>
            </li>
            <li>
                <a href="/student/select">
                    <i class="bi bi-plus-circle"></i>
                    <span>选课</span>
                </a>
            </li>
            <li class="active">
                <a href="/student/schedule">
                    <i class="bi bi-calendar3"></i>
                    <span>我的课表</span>
                </a>
            </li>
            <li>
                <a href="/student/recommendations">
                    <i class="bi bi-lightbulb"></i>
                    <span>课程推荐</span>
                </a>
            </li>
            <li>
                <a href="/logout">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>退出登录</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- 页面内容 -->
    <div id="content">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <button type="button" id="sidebarCollapse" class="btn btn-info">
                    <i class="bi bi-list"></i>
                </button>
                <span class="ms-2">我的课表</span>
            </div>
        </nav>

        <div class="container-fluid">
            <!-- 学期信息卡片 -->
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">2024春季学期</h5>
                    <div class="row">
                        <div class="col-md-4">
                            <p>总课程数：<span id="totalCourses">0</span></p>
                        </div>
                        <div class="col-md-4">
                            <p>总学分：<span id="totalCredits">0</span></p>
                        </div>
                        <div class="col-md-4">
                            <p>周课时：<span id="weeklyHours">0</span></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 课表 -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered schedule-table">
                            <thead>
                                <tr>
                                    <th>时间</th>
                                    <th>周一</th>
                                    <th>周二</th>
                                    <th>周三</th>
                                    <th>周四</th>
                                    <th>周五</th>
                                </tr>
                            </thead>
                            <tbody id="scheduleTableBody">
                                <!-- 课表内容将由JavaScript动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/schedule.js}"></script>
</body>
</html>
