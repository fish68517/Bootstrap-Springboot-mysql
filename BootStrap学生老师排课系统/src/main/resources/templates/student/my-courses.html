<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的课程</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/my-courses.css}" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <!-- 侧边栏 -->
    <nav id="sidebar" class="active">
        <div class="sidebar-header">
            <h3>排课系统</h3>
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                <span th:text="${user.username}">学生</span>
            </div>
        </div>

        <ul class="list-unstyled components">
            <li>
                <a href="/student/dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span>首页</span>
                </a>
            </li>
            <li class="active">
                <a href="/student/courses">
                    <i class="bi bi-book"></i>
                    <span>我的课程</span>
                </a>
            </li>
            <li>
                <a href="/student/select">
                    <i class="bi bi-plus-circle"></i>
                    <span>选课</span>
                </a>
            </li>
            <li>
                <a href="/student/schedule">
                    <i class="bi bi-calendar3"></i>
                    <span>我的课表</span>
                </a>
            </li>
            <li>
                <a href="/student/recommendations">
                    <i class="bi bi-lightbulb"></i>
                    <span>课程推荐</span>
                </a>
            </li>
            <li>
                <a href="/logout">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>退出登录</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- 页面内容 -->
    <div id="content">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <button type="button" id="sidebarCollapse" class="btn btn-info">
                    <i class="bi bi-list"></i>
                </button>
                <div class="d-flex align-items-center">
                    <a href="/student/select" class="btn btn-outline-primary">
                        <i class="bi bi-plus-circle"></i> 选课
                    </a>
                </div>
            </div>
        </nav>

        <div class="container-fluid mt-4">
            <h2>我的课程</h2>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>课程名称</th>
                            <th>教师</th>
                            <th>学分</th>
                            <th>上课时间</th>
                            <th>上课地点</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="myCourseList">
                        <!-- 课程数据将通过JavaScript动态加载 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 课程详情模态框 -->
<div class="modal fade" id="courseDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">课程详情</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-6">
                        <h6>基本信息</h6>
                        <table class="table">
                            <tr>
                                <th>课程名称</th>
                                <td id="detailCourseName"></td>
                            </tr>
                            <tr>
                                <th>学分</th>
                                <td id="detailCredits"></td>
                            </tr>
                            <tr>
                                <th>课程描述</th>
                                <td id="detailDescription"></td>
                            </tr>
                        </table>
                    </div>
                    <div class="col-md-6">
                        <h6>教师信息</h6>
                        <table class="table" id="detailTeachers">
                        </table>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12">
                        <h6>课程安排</h6>
                        <table class="table" id="detailSchedules">
                            <thead>
                                <tr>
                                    <th>星期</th>
                                    <th>时间</th>
                                    <th>教室</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/my-courses.js}"></script>
</body>
</html>
