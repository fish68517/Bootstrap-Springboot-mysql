<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 自定义CSS -->
    <link th:href="@{/css/login.css}" rel="stylesheet">
</head>
<body>
<div class="login-container">
    <h3 class="login-title">排课系统</h3>
    <form th:action="@{/login}" method="post" id="loginForm">
        <div class="mb-3">
            <label for="userType" class="form-label">用户类型</label>
            <select class="form-select" id="userType" name="userType" required>
                <option value="">请选择用户类型</option>
                <option value="STUDENT">学生登录</option>
                <option value="TEACHER">教师登录</option>
                <option value="ADMIN">管理员登录</option>
            </select>
            <div class="invalid-feedback">
                请选择用户类型。
            </div>
        </div>
        <div class="mb-3">
            <label for="username" class="form-label">用户名</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名" required>
            <div class="invalid-feedback">
                请输入用户名。
            </div>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">密码</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" required>
            <div class="invalid-feedback">
                请输入密码。
            </div>
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-custom">登录</button>
        </div>
        <div class="mt-3 text-center text-danger" th:if="${errorMessage}">
            <p th:text="${errorMessage}"></p>
        </div>
        <div class="mt-3 text-center text-success" th:if="${successMessage}">
            <p th:text="${successMessage}"></p>
        </div>
    </form>
</div>

<!-- Bootstrap JS and dependencies -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- 修改这里的 JavaScript 引用，使用 Thymeleaf 的 @{} 语法 -->
<script th:src="@{/js/login.js}"></script>
</body>
</html>
