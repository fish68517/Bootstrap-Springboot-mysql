<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>课程推荐</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/recommendations.css}" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <!-- 侧边栏 -->
    <nav id="sidebar">
        <div class="sidebar-header">
            <h3>排课系统</h3>
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                <span th:text="${user.username}">学生</span>
            </div>
        </div>

        <ul class="list-unstyled components">
            <li>
                <a href="/student/dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span>首页</span>
                </a>
            </li>
            <li>
                <a href="/student/courses">
                    <i class="bi bi-book"></i>
                    <span>我的课程</span>
                </a>
            </li>
            <li>
                <a href="/student/select">
                    <i class="bi bi-plus-circle"></i>
                    <span>选课</span>
                </a>
            </li>
            <li>
                <a href="/student/schedule">
                    <i class="bi bi-calendar3"></i>
                    <span>我的课表</span>
                </a>
            </li>
            <li class="active">
                <a href="/student/recommendations">
                    <i class="bi bi-lightbulb"></i>
                    <span>课程推荐</span>
                </a>
            </li>
            <li>
                <a href="/logout">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>退出登录</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- 页面内容 -->
    <div id="content">
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container-fluid">
                <button type="button" id="sidebarCollapse" class="btn btn-info">
                    <i class="bi bi-list"></i>
                </button>
            </div>
        </nav>
        <div class="container-fluid mt-4">
            <h2>课程推荐</h2>
            
            <!-- 推荐课程卡片区域 -->
            <div class="row mt-4" id="recommendationCards">
                <!-- 课程卡片将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>
</div>

<!-- 课程详情模态框 -->
<div class="modal fade" id="courseDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">课程详情</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-8">
                        <h4 id="detailCourseName"></h4>
                        <p class="text-muted" id="detailDescription"></p>
                        <div class="course-info">
                            <p><strong>学分：</strong><span id="detailCredits"></span></p>
                            <p><strong>教师：</strong><span id="detailTeacher"></span></p>

                        </div>
             <!--           <div class="recommendation-reasons mt-3">
                            <h5>推荐理由</h5>
                            <ul id="recommendationReasons">
                            </ul>
                        </div>-->
                    </div>
                    <div class="col-md-4">
                        <div class="schedule-info">
                            <h5>课程安排</h5>
                            <ul id="detailSchedule" class="list-unstyled">
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-primary" id="selectCourseBtn">选择课程</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/recommendations.js}"></script>
</body>
</html>
