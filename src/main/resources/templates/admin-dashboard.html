<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理员仪表板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <!-- 侧边栏 -->
    <nav id="sidebar">
        <div class="sidebar-header">
            <h3>排课系统</h3>
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                <span th:text="${user.username}">管理员</span>
            </div>
        </div>

        <ul class="list-unstyled components">
            <li class="active">
                <a href="/admin/dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span>首页</span>
                </a>
            </li>
            <li>
                <a href="/admin/users">
                    <i class="bi bi-people"></i>
                    <span>用户管理</span>
                </a>
            </li>
            <li>
                <a href="/admin/courses">
                    <i class="bi bi-book"></i>
                    <span>课程管理</span>
                </a>
            </li>
            <li>
                <a href="/admin/statistics">
                    <i class="bi bi-graph-up"></i>
                    <span>统计分析</span>
                </a>
            </li>
            <li>
                <a href="/logout">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>退出登录</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- 页面内容 -->
    <div id="content">
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container-fluid">
                <button type="button" id="sidebarCollapse" class="btn btn-info">
                    <i class="bi bi-list"></i>
                </button>
                <div class="d-flex align-items-center">
                    <span class="navbar-text me-3">
                        欢迎回来，<span th:text="${user.username}">管理员</span>
                    </span>
                </div>
            </div>
        </nav>

        <div class="container-fluid mt-4">
            <!-- 快速统计卡片 -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card bg-primary text-white">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-people"></i>
                                总用户数
                            </h5>
                            <h3 class="card-text" id="totalUsers">0</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-success text-white">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-person-badge"></i>
                                教师数量
                            </h5>
                            <h3 class="card-text" id="teacherCount">0</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-info text-white">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-mortarboard"></i>
                                学生数量
                            </h5>
                            <h3 class="card-text" id="studentCount">0</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-warning text-white">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-book"></i>
                                课程总数
                            </h5>
                            <h3 class="card-text" id="totalCourses">0</h3>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 功能卡片 -->
            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-people text-primary me-2"></i>
                                用户管理
                            </h5>
                            <p class="card-text">管理系统用户，包括添加、修改、删除用户等操作。</p>
                            <a href="/admin/users" class="btn btn-primary">
                                <i class="bi bi-arrow-right"></i> 进入管理
                            </a>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-book text-success me-2"></i>
                                课程管理
                            </h5>
                            <p class="card-text">管理所有课程信息，包括课程安排、教师分配等。</p>
                            <a href="/admin/courses" class="btn btn-success">
                                <i class="bi bi-arrow-right"></i> 进入管理
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 系统信息卡片 -->
            <div class="row mt-4">
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-info-circle text-info me-2"></i>
                                系统信息
                            </h5>
                            <div class="row">
                                <div class="col-md-4">
                                    <p class="mb-2">当前学期：<span id="currentTerm">2024春季</span></p>
                                    <p class="mb-2">系统状态：<span class="text-success">正常运行</span></p>
                                </div>
                           <!--     <div class="col-md-4" visible="false">
                                    <p class="mb-2">活跃课程：<span id="activeCourses">0</span></p>
                                    <p class="mb-2">选课人次：<span id="totalSelections">0</span></p>
                                </div>-->
                                <div class="col-md-4">
                                    <p class="mb-2">最近更新：<span id="lastUpdate">-</span></p>
                                    <p class="mb-2">系统版本：<span>1.0.0</span></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin-dashboard.js}"></script>
</body>
</html>
