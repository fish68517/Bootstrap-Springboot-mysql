<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>选课页面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/course-selection.css}" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <!-- 侧边栏 -->
    <nav id="sidebar" class="active">
        <div class="sidebar-header">
            <h3>排课系统</h3>
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                <span th:text="${user.username}">学生</span>
            </div>
        </div>

        <ul class="list-unstyled components">
            <li>
                <a href="/student/dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span>首页</span>
                </a>
            </li>
            <li>
                <a href="/student/courses">
                    <i class="bi bi-book"></i>
                    <span>我的课程</span>
                </a>
            </li>
            <li class="active">
                <a href="/student/select">
                    <i class="bi bi-plus-circle"></i>
                    <span>选课</span>
                </a>
            </li>

            <li class="active">
                <a href="/student/schedule">
                    <i class="bi bi-calendar3"></i>
                    <span>我的课表</span>
                </a>
            </li>
            <li>
                <a href="/student/recommendations">
                    <i class="bi bi-lightbulb"></i>
                    <span>课程推荐</span>
                </a>
            </li>
            <li>
                <a href="/logout">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>退出登录</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- 页面内容 -->
    <div id="content">
        <!-- 顶部导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <button type="button" id="sidebarCollapse" class="btn btn-info">
                    <i class="bi bi-list"></i>
                </button>
                <div class="d-flex align-items-center">
                    <div class="me-3">
                        <input type="text" class="form-control" id="searchInput" placeholder="搜索课程...">
                    </div>
                    <a href="/student/courses" class="btn btn-outline-primary">
                        <i class="bi bi-collection"></i> 已选课程
                    </a>
                </div>
            </div>
        </nav>

        <!-- 主要内容 -->
        <div class="container-fluid mt-4">
            <h2>可选课程</h2>
            
            <!-- 筛选条件 -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <select class="form-select" id="creditFilter">
                        <option value="">学分筛选</option>
                        <option value="1">1学分</option>
                        <option value="2">2学分</option>
                        <option value="3">3学分</option>
                        <option value="4">4学分</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="weekdayFilter">
                        <option value="">上课时间</option>
                        <option value="MON">周一</option>
                        <option value="TUE">周二</option>
                        <option value="WED">周三</option>
                        <option value="THU">周四</option>
                        <option value="FRI">周五</option>
                    </select>
                </div>
            </div>

            <!-- 课程列表 -->
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>课程名称</th>
                            <th>教师</th>
                            <th>学分</th>
                            <th>上课时间</th>
                            <th>上课地点</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="courseList">
                        <!-- 课程数据将通过JavaScript动态加载 -->
                    </tbody>
                </table>
            </div>

            <!-- 分页 -->
            <nav aria-label="Page navigation">
                <ul class="pagination justify-content-center" id="pagination">
                    <!-- 分页将通过JavaScript动态生成 -->
                </ul>
            </nav>
        </div>
    </div>
</div>

<!-- 选课确认模态框 -->
<div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">确认选课</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>确定要选择这门课程吗？</p>
                <div class="course-info">
                    <!-- 课程信息将通过JavaScript动态填充 -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="confirmSelection">确定选课</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/course-selection.js}"></script>
</body>
</html>
