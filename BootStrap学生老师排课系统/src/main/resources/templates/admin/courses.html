<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>课程管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <!-- 侧边栏 -->
    <nav id="sidebar">
        <div class="sidebar-header">
            <h3>排课系统</h3>
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                <span th:text="${user.username}">管理员</span>
            </div>
        </div>

        <ul class="list-unstyled components">
            <li>
                <a href="/admin/dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span>首页</span>
                </a>
            </li>
            <li>
                <a href="/admin/users">
                    <i class="bi bi-people"></i>
                    <span>用户管理</span>
                </a>
            </li>
            <li class="active">
                <a href="/admin/courses">
                    <i class="bi bi-book"></i>
                    <span>课程管理</span>
                </a>
            </li>
            <li>
                <a href="/logout">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>退出登录</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- 页面内容 -->
    <div id="content">
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container-fluid">
                <button type="button" id="sidebarCollapse" class="btn btn-info">
                    <i class="bi bi-list"></i>
                </button>
                <div class="d-flex align-items-center">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#courseModal">
                        <i class="bi bi-plus-circle me-1"></i> 添加课程
                    </button>
                </div>
            </div>
        </nav>

        <div class="container-fluid mt-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>课程管理</h2>
                <div class="d-flex gap-2">
                    <input type="text" class="form-control" id="searchInput" placeholder="搜索课程...">
                    <select class="form-select" id="creditFilter">
                        <option value="">学分筛选</option>
                        <option value="1">1学分</option>
                        <option value="2">2学分</option>
                        <option value="3">3学分</option>
                        <option value="4">4学分</option>
                    </select>
                </div>
            </div>

            <!-- 课程列表 -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>课程名称</th>
                                    <th>学分</th>
                                    <th>教师</th>
                                    <th>课程时间</th>
                                    <th>已选/容量</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="courseList">
                                <!-- 课程数据将通过JavaScript动态加载 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 添加/编辑课程模态框 -->
<div class="modal fade" id="courseModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">课程信息</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="courseForm">
                    <input type="hidden" name="id">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">课程名称</label>
                            <input type="text" class="form-control" name="courseName" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">学分</label>
                            <input type="number" class="form-control" name="credits" required min="1" max="4">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">课程描述</label>
                        <textarea class="form-control" name="description" rows="3"></textarea>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">课程容量</label>
                            <input type="number" class="form-control" name="capacity" required min="1">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">主讲教师</label>
                            <select class="form-select" name="teacherId" required>
                                <!-- 教师列表将通过JavaScript动态加载 -->
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">课程安排</label>
                        <div id="editScheduleContainer">
                            <!-- 动态添加的课程安排项 -->
                        </div>
                        <button type="button" class="btn btn-outline-primary btn-sm mt-2" id="addEditScheduleBtn">
                            <i class="bi bi-plus-circle me-1"></i>添加时间段
                        </button>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="saveCourse">保存</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin-courses.js}"></script>
</body>
</html>
