<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学生仪表板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <!-- 侧边栏 -->
    <nav id="sidebar" class="active">
        <div class="sidebar-header">
            <h3>排课系统</h3>
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                <span th:text="${user.username}">学生</span>
            </div>
        </div>

        <ul class="list-unstyled components">
            <li class="active">
                <a href="/student/dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span>首页</span>
                </a>
            </li>
            <li>
                <a href="/student/courses">
                    <i class="bi bi-book"></i>
                    <span>我的课程</span>
                </a>
            </li>
            <li>
                <a href="/student/select">
                    <i class="bi bi-plus-circle"></i>
                    <span>选课</span>
                </a>
            </li>
            <li class="active">
                <a href="/student/schedule">
                    <i class="bi bi-calendar3"></i>
                    <span>我的课表</span>
                </a>
            </li>
            <li>
                <a href="/student/recommendations">
                    <i class="bi bi-lightbulb"></i>
                    <span>课程推荐</span>
                </a>
            </li>
            <li>
                <a href="/logout">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>退出登录</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- 页面内容 -->
    <div id="content">
        <!-- 顶部导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <button type="button" id="sidebarCollapse" class="btn btn-info">
                    <i class="bi bi-list"></i>
                </button>
                <span class="navbar-text ms-3">
                        欢迎回来，<span th:text="${user.username}">同学</span>
                    </span>
            </div>
        </nav>

        <!-- 主要内容 -->
        <div class="container-fluid mt-4">
            <h2>学生仪表板</h2>
            <div class="row mt-4">
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-book text-primary"></i>
                                已选课程
                            </h5>
                            <a href="/student/courses" class="btn btn-primary">查看详情</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-plus-circle text-info"></i>
                                选课
                            </h5>
                            <a href="/student/select" class="btn btn-info">去选课</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/student-dashboard.js}"></script>
</body>
</html>
