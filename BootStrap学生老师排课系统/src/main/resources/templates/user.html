<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新闻管理</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入自定义 CSS -->
    <link rel="stylesheet" th:href="@{/css/user.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">新闻推荐系统 - 欢迎您：管理员</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/admin/logout">注销</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- 主内容 -->
<div class="container-fluid dashboard-container">
    <div class="row">
        <div class="col-lg-3">
            <th:block th:replace="navbar :: navbar"></th:block>
        </div>
        <div class="col-lg-9">
            <h1>用户管理</h1>
            <div class="table-responsive">
                <table class="table table-bordered table-hover mt-4">
                    <thead class="table-dark">
                    <tr>
                        <th>用户Id</th>
                        <th>用户名</th>
                        <th>密码</th>
                        <th>邮箱</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="userTableBody">
                    <!-- Dynamic rows will be appended here -->
                    </tbody>
                </table>
            </div>

            <!-- 分页控件 -->
            <div class="d-flex justify-content-between align-items-center mt-3">
                <div class="d-flex align-items-center">
                    <select class="form-select me-2" id="pageSize" style="width: auto;">
                        <option value="5">5条/页</option>
                        <option value="10">10条/页</option>
                        <option value="20">20条/页</option>
                    </select>
                    <span class="me-2">共 <span id="totalElements">0</span> 条</span>
                </div>
                <nav aria-label="Page navigation">
                    <ul class="pagination mb-0" id="pagination">
                        <!-- 分页按钮将通过 JavaScript 动态生成 -->
                    </ul>
                </nav>
            </div>

            <button class="btn btn-primary" onclick="addUser()">添加用户</button>
        </div>


    </div>
</div>

<!-- Include Add/Edit Modal -->
<div id="userModal"></div>

<!-- Bootstrap JS and dependencies (Popper.js) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script src="/js/user.js"></script>
</body>
</html>
