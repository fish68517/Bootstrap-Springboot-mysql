<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>教师仪表板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <!-- 侧边栏 -->
    <nav id="sidebar">
        <div class="sidebar-header">
            <h3>排课系统</h3>
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                <span th:text="${user.username}">教师</span>
            </div>
        </div>

        <ul class="list-unstyled components">
            <li class="active">
                <a href="/teacher/dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span>首页</span>
                </a>
            </li>
            <li>
                <a href="/teacher/courses">
                    <i class="bi bi-book"></i>
                    <span>课程管理</span>
                </a>
            </li>

            <li>
                <a href="/teacher/course-stats">
                    <i class="bi bi-graph-up"></i>
                    <span>课程统计</span>
                </a>
            </li>

            <li >
                <a href="/teacher/schedule">
                    <i class="bi bi-calendar3"></i>
                    <span>我的课表</span>
                </a>
            </li>
            <li>
                <a href="/logout">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>退出登录</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- 页面内容 -->
    <div id="content">
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container-fluid">
                <button type="button" id="sidebarCollapse" class="btn btn-info">
                    <i class="bi bi-list"></i>
                </button>
            </div>
        </nav>

        <div class="container-fluid mt-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>教师仪表板</h2>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-book text-primary me-2"></i>
                                我的课程
                            </h5>
                           <!-- <p class="card-text">当前课程数：<span id="courseCount">5</span></p>-->
                            <a href="/teacher/courses" class="btn btn-primary">查看详情</a>
                        </div>
                    </div>
                </div>
                <!-- 可以根据需要添加更多卡片 -->
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
$(document).ready(function() {
    // 侧边栏切换
    $('#sidebarCollapse').on('click', function() {
        $('#sidebar').toggleClass('active');
    });

   /* // 获取 courseCount 元素
    const courseCountElement = document.getElementById('courseCount');

    // 更新课程数量
    courseCountElement.textContent = '10'; // 将 5 更新为 10*/
});
</script>
</body>
</html>
